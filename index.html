<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HexTask</title>
  <link rel="icon" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="caixa">
    <div class="topo">
      <img src="assets/img/logo.png" alt="" class="logo">
      <div>
        <h1>HexTask</h1>
      </div>
    </div>

    <div class="formulario">
      <input type="text" id="campo" placeholder="O que você precisa fazer hoje?">
      <select id="categoria">
        <option value="casa">Casa</option>
        <option value="trabalho">Trabalho</option>
        <option value="estudos">Estudos</option>
        <option value="mercado">Mercado</option>
        <option value="saude">Saúde</option>
        <option value="outros">Outros</option>
      </select>
      <button id="botao">Adicionar</button>
    </div>

    <div class="conteudo">

      <!-- Quadro com as colunas -->
      <div class="quadro">
        <div class="coluna">
          <h2>A fazer <span id="total-pendentes">0</span></h2>
          <ul id="pendentes" class="lista"></ul>
        </div>

        <div class="coluna">
          <h2>Feito <span id="total-concluidas">0</span></h2>
          <ul id="concluidas" class="lista"></ul>
          <button id="limpar">Limpar concluídas</button>
        </div>
      </div>

    </div>

    <p class="dica">Clique numa tarefa ou arraste para mudar de coluna.</p>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
