<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HexTask</title>
  <link rel="icon" href="assets/img/logo.png">

  <!-- Instalar como app (PWA): nome, ícones e cores ficam no manifest.json -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FFFFFF">

  <!-- iPhone: ícone da tela inicial e abrir em tela cheia -->
  <link rel="apple-touch-icon" href="assets/img/icone-apple.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="HexTask">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="caixa">
    <header class="topo">
      <img src="assets/img/logo.png" alt="Logo do HexTask: um cristal azul dentro de um emblema dourado" class="logo">
      <div>
        <h1>HexTask</h1>
        <p id="saudacao"></p>
      </div>
      <button id="tema" title="Ativar tema escuro" aria-label="Ativar tema escuro">☾</button>
    </header>

    <main>
      <!-- Formulário para criar uma tarefa (os labels ficam escondidos na tela, mas o leitor de tela lê) -->
      <section class="formulario" aria-label="Nova tarefa">
        <label for="campo" class="so-leitor">Tarefa</label>
        <input type="text" id="campo" placeholder="O que você precisa fazer hoje?">

        <label for="categoria" class="so-leitor">Categoria</label>
        <select id="categoria">
          <option value="casa">Casa</option>
          <option value="trabalho">Trabalho</option>
          <option value="estudos">Estudos</option>
          <option value="mercado">Mercado</option>
          <option value="saude">Saúde</option>
          <option value="outros">Outros</option>
        </select>

        <label for="prioridade" class="so-leitor">Prioridade</label>
        <select id="prioridade">
          <option value="alta">Prioridade alta</option>
          <option value="media" selected>Prioridade média</option>
          <option value="baixa">Prioridade baixa</option>
        </select>

        <button id="botao">Adicionar</button>
      </section>

      <div class="conteudo">

        <!-- Painel com o resumo do dia -->
        <aside class="resumo" aria-label="Resumo do dia">
          <h2 class="titulo-painel">Progresso do dia</h2>
          <p class="porcentagem"><span id="porcentagem">0</span>%</p>
          <div id="barra" class="barra" role="progressbar" aria-label="Progresso do dia" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="barra-cheia" class="barra-cheia"></div>
          </div>
          <!-- aria-live: o leitor de tela avisa quando esse texto muda -->
          <p id="texto-progresso" class="texto-progresso" aria-live="polite">Nenhuma tarefa ainda</p>

          <h2 class="titulo-painel">Categorias</h2>
          <div class="filtros">
            <button class="filtro ativo" data-categoria="todas" aria-pressed="true">
              <span class="bolinha todas" aria-hidden="true"></span> Todas <span class="quantidade" id="qtd-todas">0</span>
            </button>
            <button class="filtro" data-categoria="casa" aria-pressed="false">
              <span class="bolinha casa" aria-hidden="true"></span> Casa <span class="quantidade" id="qtd-casa">0</span>
            </button>
            <button class="filtro" data-categoria="trabalho" aria-pressed="false">
              <span class="bolinha trabalho" aria-hidden="true"></span> Trabalho <span class="quantidade" id="qtd-trabalho">0</span>
            </button>
            <button class="filtro" data-categoria="estudos" aria-pressed="false">
              <span class="bolinha estudos" aria-hidden="true"></span> Estudos <span class="quantidade" id="qtd-estudos">0</span>
            </button>
            <button class="filtro" data-categoria="mercado" aria-pressed="false">
              <span class="bolinha mercado" aria-hidden="true"></span> Mercado <span class="quantidade" id="qtd-mercado">0</span>
            </button>
            <button class="filtro" data-categoria="saude" aria-pressed="false">
              <span class="bolinha saude" aria-hidden="true"></span> Saúde <span class="quantidade" id="qtd-saude">0</span>
            </button>
            <button class="filtro" data-categoria="outros" aria-pressed="false">
              <span class="bolinha outros" aria-hidden="true"></span> Outros <span class="quantidade" id="qtd-outros">0</span>
            </button>
          </div>
        </aside>

        <!-- Quadro com as 3 colunas -->
        <div class="quadro">
          <section class="coluna" aria-labelledby="titulo-pendentes">
            <h2 id="titulo-pendentes">A fazer <span id="total-pendentes">0</span></h2>
            <ul id="pendentes" class="lista"></ul>
          </section>

          <section class="coluna" aria-labelledby="titulo-fazendo">
            <h2 id="titulo-fazendo">Fazendo <span id="total-fazendo">0</span></h2>
            <ul id="fazendo" class="lista"></ul>
          </section>

          <section class="coluna" aria-labelledby="titulo-concluidas">
            <h2 id="titulo-concluidas">Feito <span id="total-concluidas">0</span></h2>
            <ul id="concluidas" class="lista"></ul>
            <button id="limpar">Limpar concluídas</button>
          </section>
        </div>

      </div>
    </main>

    <footer class="dica">
      Clique numa tarefa (ou use Tab e Enter) para avançar de coluna, ou arraste para onde quiser. Suas tarefas ficam salvas neste navegador.
    </footer>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
