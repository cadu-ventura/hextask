<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HexTask</title>
  <link rel="icon" href="assets/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="caixa">
    <div class="topo">
      <img src="assets/img/logo.png" alt="" class="logo">
      <div>
        <h1>HexTask</h1>
        <p id="saudacao"></p>
      </div>
      <button id="tema" title="Ativar tema escuro" aria-label="Ativar tema escuro">☾</button>
    </div>

    <div class="formulario">
      <input type="text" id="campo" placeholder="O que você precisa fazer hoje?">
      <select id="categoria">
        <option value="casa">Casa</option>
        <option value="trabalho">Trabalho</option>
        <option value="estudos">Estudos</option>
        <option value="mercado">Mercado</option>
        <option value="saude">Saúde</option>
        <option value="outros">Outros</option>
      </select>
      <select id="prioridade">
        <option value="alta">Prioridade alta</option>
        <option value="media" selected>Prioridade média</option>
        <option value="baixa">Prioridade baixa</option>
      </select>
      <button id="botao">Adicionar</button>
    </div>

    <div class="conteudo">

      <!-- Painel com o resumo do dia -->
      <div class="resumo">
        <h3>Progresso do dia</h3>
        <p class="porcentagem"><span id="porcentagem">0</span>%</p>
        <div class="barra">
          <div id="barra-cheia" class="barra-cheia"></div>
        </div>
        <p id="texto-progresso" class="texto-progresso">Nenhuma tarefa ainda</p>

        <h3>Categorias</h3>
        <div class="filtros">
          <button class="filtro ativo" data-categoria="todas">
            <span class="bolinha todas"></span> Todas <span class="quantidade" id="qtd-todas">0</span>
          </button>
          <button class="filtro" data-categoria="casa">
            <span class="bolinha casa"></span> Casa <span class="quantidade" id="qtd-casa">0</span>
          </button>
          <button class="filtro" data-categoria="trabalho">
            <span class="bolinha trabalho"></span> Trabalho <span class="quantidade" id="qtd-trabalho">0</span>
          </button>
          <button class="filtro" data-categoria="estudos">
            <span class="bolinha estudos"></span> Estudos <span class="quantidade" id="qtd-estudos">0</span>
          </button>
          <button class="filtro" data-categoria="mercado">
            <span class="bolinha mercado"></span> Mercado <span class="quantidade" id="qtd-mercado">0</span>
          </button>
          <button class="filtro" data-categoria="saude">
            <span class="bolinha saude"></span> Saúde <span class="quantidade" id="qtd-saude">0</span>
          </button>
          <button class="filtro" data-categoria="outros">
            <span class="bolinha outros"></span> Outros <span class="quantidade" id="qtd-outros">0</span>
          </button>
        </div>
      </div>

      <!-- Quadro com as 3 colunas -->
      <div class="quadro">
        <div class="coluna">
          <h2>A fazer <span id="total-pendentes">0</span></h2>
          <ul id="pendentes" class="lista"></ul>
        </div>

        <div class="coluna">
          <h2>Fazendo <span id="total-fazendo">0</span></h2>
          <ul id="fazendo" class="lista"></ul>
        </div>

        <div class="coluna">
          <h2>Feito <span id="total-concluidas">0</span></h2>
          <ul id="concluidas" class="lista"></ul>
          <button id="limpar">Limpar concluídas</button>
        </div>
      </div>

    </div>

    <p class="dica">Clique numa tarefa para avançar de coluna ou arraste para onde quiser. Suas tarefas ficam salvas neste navegador.</p>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
